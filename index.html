<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orey Xia — Designer-Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Hanken+Grotesk:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
[data-theme="dark"]{--bg:#0C0B0A;--bg-2:#15130F;--fg:#F1ECE0;--fg-soft:#8C8377;--rule:#2A2620;--accent:#D2724F;--aster:#F1ECE0;--aster-ambient:rgba(241,236,224,.05);--live:rgba(210,114,79,.5);--live0:rgba(210,114,79,0)}
[data-theme="cream"]{--bg:#F4F1EA;--bg-2:#ECE7DA;--fg:#1C1813;--fg-soft:#6A6157;--rule:#D8D0BE;--accent:#A8432E;--aster:#1C1813;--aster-ambient:rgba(28,24,19,.05);--live:rgba(168,67,46,.5);--live0:rgba(168,67,46,0)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:'Hanken Grotesk',sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;transition:background .4s ease,color .4s ease}
a{color:inherit;text-decoration:none}
.aster{display:inline-block;fill:var(--aster)}
.ambient{position:fixed;pointer-events:none;z-index:0;fill:var(--aster-ambient);transition:fill .4s ease}
.ambient.a1{top:-100px;right:-80px;width:340px;transform-origin:center;animation:spin 90s linear infinite}
.ambient.a2{bottom:9%;left:25%;width:120px;animation:spin 130s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.sidenav{position:fixed;top:0;left:0;height:100vh;width:200px;display:flex;flex-direction:column;padding:40px 0 34px 40px;z-index:10}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:auto}
.brand .aster{width:24px}
.brand b{font-weight:800;font-size:18px;letter-spacing:-.02em}
.nav-list{display:flex;flex-direction:column;gap:5px;margin-bottom:34px}
.nav-list a{font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.02em;color:var(--fg-soft);padding:5px 0;width:max-content;display:flex;align-items:center;gap:8px;transition:color .18s ease}
.nav-list a .dot{opacity:0;font-size:11px;color:var(--accent);transition:opacity .18s ease}
.nav-list a:hover,.nav-list a.active{color:var(--fg)}
.nav-list a.active .dot{opacity:1}
.toggle{display:flex;align-items:center;gap:9px;cursor:pointer;background:none;border:none;font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--fg-soft);padding:0;transition:color .18s ease}
.toggle:hover{color:var(--fg)}
.toggle svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6}
main{margin-left:200px;position:relative;z-index:1}
.wrap{max-width:900px;padding:0 44px}
section{padding:0 0 120px}
#intro{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding-top:60px}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:30px;flex-wrap:wrap}
.hey{font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.04em;color:var(--fg-soft);display:flex;align-items:center;gap:9px}
.hey .aster{width:12px}
.status{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.04em;color:var(--fg-soft);display:flex;align-items:center;gap:9px}
.dot-live{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;animation:live 2.2s ease-out infinite}
@keyframes live{0%{box-shadow:0 0 0 0 var(--live)}100%{box-shadow:0 0 0 9px var(--live0)}}
.role{font-weight:400;font-size:clamp(19px,2.5vw,27px);color:var(--fg-soft);letter-spacing:-.01em;margin-bottom:26px;max-width:30ch}
.statement{font-weight:800;font-size:clamp(46px,8.4vw,94px);line-height:1.02;letter-spacing:-.035em;color:var(--fg);max-width:15ch}
.cycle{color:var(--accent)}
.cycle .word{display:inline-block}
.cycle .word.out{animation:wordout .4s ease forwards}
.cycle .word.in{animation:wordin .46s ease forwards}
@keyframes wordout{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-.5em)}}
@keyframes wordin{from{opacity:0;transform:translateY(.5em)}to{opacity:1;transform:translateY(0)}}
.actions{display:flex;align-items:center;gap:16px;margin-top:34px;flex-wrap:wrap}
.icon-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--rule);display:flex;align-items:center;justify-content:center;transition:all .18s ease}
.icon-btn:hover{background:var(--fg);border-color:var(--fg)}
.icon-btn svg{width:18px;height:18px;fill:var(--fg);transition:fill .18s ease}
.icon-btn:hover svg{fill:var(--bg)}
.resume{font-weight:700;font-size:14px;padding:10px 22px;border:1px solid var(--fg);border-radius:999px;transition:all .18s ease}
.resume:hover{background:var(--fg);color:var(--bg)}
.pipeline{margin-top:72px;max-width:980px}
.pipe-cap{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.06em;color:var(--fg-soft);margin-bottom:18px;display:flex;align-items:center;gap:9px}
.pipe-cap .aster{width:12px}
.pipe-cap b{color:var(--fg);font-weight:500}
.pipe-wrap{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
.pipe-svg{width:100%;min-width:720px;height:auto;display:block}
.node-base{fill:var(--bg-2);stroke:var(--rule);stroke-width:1.5}
.node-label{fill:var(--fg-soft);font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.02em;text-anchor:middle}
.connector{stroke:var(--rule);stroke-width:2;fill:none}
.flow{stroke:var(--accent);stroke-width:2;fill:none;stroke-dasharray:5 11;opacity:.55;animation:dash 1.1s linear infinite}
.packet{fill:var(--accent);animation:travel 7s cubic-bezier(.65,0,.35,1) infinite}
.packet-halo{fill:var(--accent);opacity:.25;animation:travel 7s cubic-bezier(.65,0,.35,1) infinite}
@keyframes dash{to{stroke-dashoffset:-16}}
@keyframes travel{0%{transform:translateX(0)}85%{transform:translateX(900px)}100%{transform:translateX(900px)}}
.sec-head{font-family:'JetBrains Mono',monospace;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-soft);display:flex;align-items:center;gap:10px;margin-bottom:34px;padding-top:14px;border-top:1px solid var(--rule)}
.sec-head .aster{width:13px}
.about-hero{display:flex;gap:44px;align-items:flex-start}
.about-photo{width:200px;height:200px;border-radius:50%;object-fit:cover;border:1px solid var(--rule);flex:none;box-shadow:0 18px 50px rgba(0,0,0,.5)}
.about-text{flex:1}
.about-eyebrow{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-soft);margin-bottom:14px}
.about-name{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(36px,5vw,54px);line-height:1;letter-spacing:-.02em;margin-bottom:18px}
.about-name .dot{color:var(--accent)}
.about-headline{font-family:'Fraunces',serif;font-weight:500;font-size:clamp(20px,2.6vw,27px);line-height:1.3;margin-bottom:24px;color:var(--fg)}
.about-headline .cycle{color:var(--accent);font-style:italic}
.about-text .prose p{font-size:16px;line-height:1.66;color:var(--fg-soft);max-width:58ch;margin-bottom:14px}
.about-text .prose p:last-child{margin-bottom:0}
.affil{display:inline-flex;align-items:center;gap:9px;margin-top:26px;padding:7px 14px;border:1px solid var(--rule);border-radius:999px;width:max-content}
.affil-logo{height:18px;width:auto;display:block}
.affil-text{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.03em;color:var(--fg-soft)}
.affil-text b{color:var(--fg);font-weight:500}
.proj{display:block;padding:24px 0;border-bottom:1px solid var(--rule);transition:padding-left .22s ease}
.proj:hover{padding-left:12px}
.proj-top{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}
.proj-title{font-weight:700;font-size:23px;letter-spacing:-.02em}
.proj-title .arrow{color:var(--accent);opacity:0;transition:opacity .2s ease}
.proj:hover .proj-title .arrow{opacity:1}
.proj-tags{font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.04em;color:var(--fg-soft);white-space:nowrap}
.proj-desc{font-size:15.5px;color:var(--fg-soft);margin-top:8px;max-width:60ch}
.contact-line{font-weight:700;font-size:clamp(26px,4vw,42px);letter-spacing:-.025em;line-height:1.15;max-width:16ch}
.contact-line a{border-bottom:3px solid var(--accent);transition:color .18s ease}
.contact-line a:hover{color:var(--accent)}
.contact-meta{margin-top:26px;display:flex;gap:14px;flex-wrap:wrap}
footer{margin-left:200px;padding:30px 44px 50px;border-top:1px solid var(--rule)}
.foot{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--fg-soft);letter-spacing:.03em}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}.ambient,.flow,.packet,.packet-halo,.dot-live,.node-glow,.node-ring{animation:none!important}.packet,.packet-halo{opacity:0}}
@media (max-width:820px){
  .sidenav{position:static;flex-direction:row;align-items:center;height:auto;width:auto;padding:22px 28px;gap:22px;flex-wrap:wrap;border-bottom:1px solid var(--rule)}
  .brand{margin-bottom:0;margin-right:auto}
  .nav-list{flex-direction:row;gap:16px;margin-bottom:0}
  .nav-list a .dot{display:none}
  main,footer{margin-left:0}
  #intro{min-height:auto;padding:50px 0 90px}
  .ambient.a1{width:200px}
  .pipeline{margin-top:54px}
  .about-hero{flex-direction:column;gap:28px}
}
</style>
</head>

(function(){
  var N=PIPELINE.length, x0=70, x1=950, y=58, span=x1-x0, gap=span/(N-1), cycle=7;
  var svg='<line class="connector" x1="'+x0+'" y1="'+y+'" x2="'+x1+'" y2="'+y+'"/><line class="flow" x1="'+x0+'" y1="'+y+'" x2="'+x1+'" y2="'+y+'"/>';
  PIPELINE.forEach(function(label,i){
    var cx=x0+gap*i, delay=(i/(N-1))*(cycle*(900/span));
    svg+='<circle class="node-ring" cx="'+cx+'" cy="'+y+'" r="14" style="animation-delay:'+delay.toFixed(2)+'s"/>';
    svg+='<circle class="node-glow" cx="'+cx+'" cy="'+y+'" r="9" style="animation-delay:'+delay.toFixed(2)+'s"/>';
    svg+='<circle class="node-base" cx="'+cx+'" cy="'+y+'" r="9"/>';
    var w=label.split(' ');
    var t=w.length>1?'<tspan x="'+cx+'" dy="0">'+w[0]+'</tspan><tspan x="'+cx+'" dy="15">'+w.slice(1).join(' ')+'</tspan>':'<tspan x="'+cx+'" dy="0">'+label+'</tspan>';
    svg+='<text class="node-label" x="'+cx+'" y="'+(y+30)+'">'+t+'</text>';
  });
  svg+='<circle class="packet-halo" cx="'+x0+'" cy="'+y+'" r="11"/><circle class="packet" cx="'+x0+'" cy="'+y+'" r="5"/>';
  document.getElementById('pipe').innerHTML=svg;
  var style=document.createElement('style');
  style.textContent='.node-glow{fill:var(--accent);opacity:0;animation:flash 7s ease-out infinite}.node-ring{fill:none;stroke:var(--accent);stroke-width:1.5;opacity:0;animation:flashring 7s ease-out infinite}@keyframes flash{0%{opacity:0}3%{opacity:.9}12%{opacity:0}100%{opacity:0}}@keyframes flashring{0%{opacity:0;r:9}3%{opacity:.8;r:9}16%{opacity:0;r:22}100%{opacity:0}}';
  document.head.appendChild(style);
})();

function setTheme(t){root.setAttribute('data-theme',t);document.body.setAttribute('data-theme',t);var d=t==='dark';tLabel.textContent=d?'Light mode':'Dark mode';tIcon.innerHTML=d?sun:moon;}
setTheme('dark');
tBtn.addEventListener('click',function(){setTheme(root.getAttribute('data-theme')==='dark'?'cream':'dark');});
var links=[].slice.call(document.querySelectorAll('#navlist a')), map={};
links.forEach(function(l){map[l.getAttribute('href').slice(1)]=l;});
var obs=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){links.forEach(function(l){l.classList.remove('active');});if(map[e.target.id])map[e.target.id].classList.add('active');}});},{rootMargin:'-45% 0px -45% 0px'});
document.querySelectorAll('main section').forEach(function(s){obs.observe(s);});
